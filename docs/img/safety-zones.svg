<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1040" height="620" fill="#fff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">KAI V1 — safety zones (top view of desk)</text>
  <text x="40" y="66" font-size="13" fill="#64748b">Concept layout · envelope radius ≈ arm reach (estimate/target, not measured) · not to scale</text>

  <!-- desk -->
  <rect x="40" y="90" width="700" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54" y="456" font-size="12" fill="#64748b">desk (back edge at top)</text>
  <!-- base at back edge -->
  <circle cx="390" cy="110" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <text x="410" y="108" font-size="11" fill="#334155">clamp + J1</text>

  <!-- motion envelope: J1 ±90 sweep radius 300 -->
  <path d="M390,110 L90,110 A300,300 0 0,0 690,110 Z" fill="#fee2e2" fill-opacity="0.75" stroke="#dc2626" stroke-width="2.5"/>
  <text x="130" y="250" font-size="15" font-weight="700" fill="#b91c1c">MOTION ENVELOPE</text>
  <text x="130" y="270" font-size="12" fill="#991b1b">J1 soft range ±90° (A) × reach ≈ 400–500 mm</text>
  <text x="130" y="288" font-size="12" fill="#991b1b">no hands / face while armed &amp; moving</text>

  <!-- arm line + pinch zones -->
  <line x1="390" y1="110" x2="520" y2="330" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <circle cx="520" cy="330" r="10" fill="#334155"/>
  <g fill="#f59e0b" fill-opacity="0.85" stroke="#b45309" stroke-width="1.5">
    <circle cx="398" cy="132" r="22"/>
    <ellipse cx="455" cy="220" rx="34" ry="16" transform="rotate(59 455 220)"/>
    <circle cx="520" cy="330" r="18"/>
  </g>
  <text x="430" y="140" font-size="11" font-weight="700" fill="#92400e">P1 J1 base + belt</text>
  <text x="490" y="215" font-size="11" font-weight="700" fill="#92400e">P2 J2 parallelogram</text>
  <text x="490" y="230" font-size="11" fill="#92400e">+ belt/pulley</text>
  <text x="544" y="336" font-size="11" font-weight="700" fill="#92400e">P3 head / clamp</text>

  <!-- operator zone -->
  <rect x="80" y="470" width="620" height="110" rx="12" fill="#dcfce7" fill-opacity="0.8" stroke="#16a34a" stroke-width="2"/>
  <text x="96" y="496" font-size="15" font-weight="700" fill="#166534">OPERATOR ZONE</text>
  <text x="96" y="516" font-size="12" fill="#166534">user seated at front edge</text>
  <!-- face keep-out -->
  <rect x="300" y="420" width="180" height="46" rx="8" fill="#fecaca" stroke="#991b1b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="314" y="440" font-size="12" font-weight="700" fill="#991b1b">FACE KEEP-OUT</text>
  <text x="314" y="456" font-size="11" fill="#991b1b">never jog arm here</text>
  <!-- panel -->
  <rect x="560" y="500" width="110" height="64" rx="8" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="645" cy="532" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <circle cx="590" cy="532" r="10" fill="#94a3b8"/>
  <text x="562" y="494" font-size="11" font-weight="700" fill="#0f172a">panel + E-STOP</text>

  <!-- legend / rules -->
  <rect x="770" y="90" width="240" height="500" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="786" y="118" font-size="14" font-weight="700" fill="#0f172a">Zone rules</text>
  <g font-size="12" fill="#334155">
    <rect x="786" y="134" width="16" height="16" fill="#fee2e2" stroke="#dc2626"/><text x="810" y="147">Motion envelope</text>
    <text x="810" y="164" font-size="11" fill="#64748b">keep clear while armed</text>
    <rect x="786" y="180" width="16" height="16" fill="#f59e0b" stroke="#b45309"/><text x="810" y="193">Pinch zone</text>
    <text x="810" y="210" font-size="11" fill="#64748b">guard where possible; hands-off</text>
    <rect x="786" y="226" width="16" height="16" fill="#dcfce7" stroke="#16a34a"/><text x="810" y="239">Operator zone</text>
    <text x="810" y="256" font-size="11" fill="#64748b">panel + E-stop live here</text>
    <rect x="786" y="272" width="16" height="16" fill="#fecaca" stroke="#991b1b" stroke-dasharray="3 2"/><text x="810" y="285">Face keep-out</text>
    <text x="810" y="302" font-size="11" fill="#64748b">no positioning near face</text>
  </g>
  <text x="786" y="340" font-size="14" font-weight="700" fill="#0f172a">Key procedures</text>
  <g font-size="11" fill="#334155">
    <text x="786" y="362">• Swap attachments: lowest pos →</text>
    <text x="796" y="378">SAFE → swap → pull test → re-arm</text>
    <text x="786" y="398">• E-stop check at session start</text>
    <text x="786" y="418">• Never push the arm by hand</text>
    <text x="796" y="434">(worm drives; belt will slip)</text>
    <text x="786" y="454">• Never open the gas spring</text>
    <text x="786" y="474">• Device secure before arming</text>
  </g>
  <text x="786" y="510" font-size="11" fill="#64748b">(A) = assumption.</text>
  <text x="786" y="526" font-size="11" fill="#64748b">Hazard IDs: docs/safety.md</text>
</svg>

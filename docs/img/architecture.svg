<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="1040" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1040" height="800" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">KAI V1 — system architecture</text>
  <text x="40" y="70" font-size="13" fill="#64748b">STATUS: DESIGN / NOT YET BUILT · V1 actuates J1 + J2 (J3 optional) · actuator models pending donor measurement</text>

  <!-- MAIN SIGNAL CHAIN (centre) -->
  <rect x="420" y="96" width="200" height="40" rx="20" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="121" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">USER</text>

  <rect x="370" y="166" width="300" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="192" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">JOYSTICK · BUTTONS · ACCESSIBLE INPUT</text>
  <text x="520" y="212" font-size="12" fill="#475569" text-anchor="middle">self-centring joystick · ARM/MODE · SLOW · 2-switch jack</text>

  <rect x="340" y="258" width="360" height="104" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="360" y="290" font-size="20" font-weight="700" fill="#312e81">ESP32-S3</text>
  <rect x="360" y="304" width="150" height="44" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="435" y="324" font-size="12" font-weight="700" fill="#1e1b4b" text-anchor="middle">State machine</text>
  <text x="435" y="340" font-size="11" fill="#3730a3" text-anchor="middle">SAFE · ACTIVE · FAULT</text>
  <rect x="530" y="304" width="150" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="605" y="324" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Safety logic</text>
  <text x="605" y="340" font-size="11" fill="#991b1b" text-anchor="middle">limits · watchdog · K1</text>

  <rect x="370" y="392" width="300" height="56" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="416" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">MOTION CONTROL</text>
  <text x="520" y="435" font-size="12" fill="#475569" text-anchor="middle">jog · ramps · speed caps · H-bridge</text>

  <rect x="370" y="478" width="300" height="56" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="520" y="502" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">ACTUATORS</text>
  <text x="520" y="521" font-size="12" fill="#9a3412" text-anchor="middle">J1 base yaw · J2 spring arm · (J3 optional)</text>

  <rect x="330" y="566" width="380" height="84" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="520" y="598" font-size="18" font-weight="700" fill="#78350f" text-anchor="middle">COUNTERBALANCED MECHANICAL ARM</text>
  <text x="520" y="620" font-size="12" fill="#92400e" text-anchor="middle">donor gas-spring monitor arm (NB F80, provisional)</text>
  <text x="520" y="637" font-size="12" fill="#92400e" text-anchor="middle">spring carries gravity · actuators handle residual + friction</text>

  <rect x="395" y="680" width="250" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="520" y="703" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">MODULAR END EFFECTOR</text>
  <text x="520" y="722" font-size="12" fill="#065f46" text-anchor="middle">Arca-compatible + ¼"-20</text>

  <g stroke="#1e293b" stroke-width="2.2" fill="none">
    <line x1="520" y1="136" x2="520" y2="162" marker-end="url(#s)"/>
    <line x1="520" y1="228" x2="520" y2="254" marker-end="url(#s)"/>
    <line x1="520" y1="362" x2="520" y2="388" marker-end="url(#s)"/>
    <line x1="520" y1="448" x2="520" y2="474" marker-end="url(#s)"/>
    <line x1="520" y1="534" x2="520" y2="562" marker-end="url(#s)"/>
    <line x1="520" y1="650" x2="520" y2="676" marker-end="url(#s)"/>
  </g>

  <!-- LEFT: E-STOP + POWER -->
  <rect x="40" y="258" width="220" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="150" y="290" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="middle">E-STOP</text>
  <text x="150" y="312" font-size="12" fill="#7f1d1d" text-anchor="middle">latching · NC · in K1 coil loop</text>
  <text x="150" y="328" font-size="11" fill="#7f1d1d" text-anchor="middle">independent of firmware</text>

  <rect x="40" y="392" width="220" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="420" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">ACTUATOR POWER CUT</text>
  <text x="150" y="440" font-size="12" fill="#7f1d1d" text-anchor="middle">relay K1 · off by default</text>

  <rect x="40" y="566" width="100" height="56" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="90" y="590" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">12 V supply</text>
  <text x="90" y="607" font-size="11" fill="#9a3412" text-anchor="middle">provisional</text>
  <rect x="170" y="566" width="90" height="56" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="215" y="599" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Fuse F1</text>

  <line x1="150" y1="338" x2="150" y2="388" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#r)"/>
  <g stroke="#c2410c" stroke-width="4" fill="none">
    <line x1="140" y1="594" x2="166" y2="594" marker-end="url(#p)"/>
    <path d="M215,566 L215,466" marker-end="url(#p)"/>
    <path d="M260,427 L310,427 L310,506 L366,506" marker-end="url(#p)"/>
  </g>
  <text x="332" y="476" font-size="11" fill="#c2410c" transform="rotate(-90 332 476)">actuator rail</text>
  <path d="M260,410 L300,410 L300,340 L336,340" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 4" fill="none" marker-end="url(#r)"/>
  <text x="196" y="380" font-size="11" fill="#b91c1c">rail sense → MCU</text>

  <!-- RIGHT: LIMIT SWITCHES -->
  <rect x="780" y="566" width="220" height="84" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="890" y="596" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">LIMIT SWITCHES</text>
  <text x="890" y="617" font-size="12" fill="#7f1d1d" text-anchor="middle">J1 left/right · J2 up/down</text>
  <text x="890" y="634" font-size="11" fill="#7f1d1d" text-anchor="middle">NC wiring: broken wire = stop</text>
  <line x1="710" y1="608" x2="776" y2="608" stroke="#d97706" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="718" y="598" font-size="10" fill="#92400e">on arm</text>
  <path d="M890,566 L890,326 L684,326" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 4" fill="none" marker-end="url(#r)"/>
  <text x="900" y="450" font-size="12" fill="#b91c1c">to ESP32-S3</text>
  <text x="900" y="466" font-size="12" fill="#b91c1c">safety logic</text>

  <path d="M684,346 L740,346 L740,420 L674,420" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 4" fill="none" marker-end="url(#r)"/>
  <text x="746" y="388" font-size="11" fill="#b91c1c">blocks motion</text>

  <!-- LEGEND -->
  <rect x="780" y="680" width="220" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="12" fill="#334155">
    <line x1="796" y1="704" x2="836" y2="704" stroke="#1e293b" stroke-width="2.2" marker-end="url(#s)"/><text x="846" y="708">signal path</text>
    <line x1="796" y1="730" x2="836" y2="730" stroke="#c2410c" stroke-width="4" marker-end="url(#p)"/><text x="846" y="734">actuator power path</text>
    <line x1="796" y1="756" x2="836" y2="756" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#r)"/><text x="846" y="760">safety path</text>
  </g>
</svg>

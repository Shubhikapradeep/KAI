<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1040" height="660" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">KAI V1 — electronics: three separate paths</text>
  <text x="40" y="66" font-size="13" fill="#64748b">Paper design · not built · supply/fuse/driver ratings set after actuator selection</text>

  <!-- Lane backgrounds -->
  <rect x="20" y="86" width="1000" height="168" rx="12" fill="#eff6ff"/>
  <rect x="20" y="266" width="1000" height="138" rx="12" fill="#fff7ed"/>
  <rect x="20" y="416" width="1000" height="200" rx="12" fill="#fef2f2"/>
  <text x="36" y="110" font-size="13" font-weight="700" fill="#1d4ed8">LOGIC PATH</text>
  <text x="36" y="290" font-size="13" font-weight="700" fill="#c2410c">ACTUATOR POWER PATH</text>
  <text x="36" y="440" font-size="13" font-weight="700" fill="#dc2626">SAFETY PATH — E-stop works without firmware</text>

  <!-- LOGIC -->
  <g font-size="12">
    <rect x="40" y="124" width="150" height="34" rx="8" fill="#fff" stroke="#93c5fd"/><text x="115" y="146" text-anchor="middle" fill="#1e3a8a">Joystick (X→J1, Y→J2)</text>
    <rect x="40" y="166" width="150" height="34" rx="8" fill="#fff" stroke="#93c5fd"/><text x="115" y="188" text-anchor="middle" fill="#1e3a8a">ARM/MODE · SLOW</text>
    <rect x="40" y="208" width="150" height="34" rx="8" fill="#fff" stroke="#93c5fd"/><text x="115" y="230" text-anchor="middle" fill="#1e3a8a">2-switch jack (3.5 mm)</text>
  </g>
  <rect x="300" y="120" width="250" height="122" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="425" y="152" font-size="19" font-weight="700" fill="#312e81" text-anchor="middle">ESP32-S3</text>
  <text x="425" y="174" font-size="12" fill="#3730a3" text-anchor="middle">safety task · motion · input · UI</text>
  <text x="425" y="194" font-size="12" fill="#3730a3" text-anchor="middle">LEDC PWM · ADC · watchdog</text>
  <text x="425" y="224" font-size="11" fill="#6366f1" text-anchor="middle">USB-C: config / logs</text>
  <rect x="620" y="124" width="170" height="40" rx="8" fill="#fff" stroke="#93c5fd"/><text x="705" y="149" font-size="12" text-anchor="middle" fill="#1e3a8a">PWM / IN1 / IN2 ×2</text>
  <rect x="620" y="176" width="170" height="34" rx="8" fill="#fff" stroke="#93c5fd"/><text x="705" y="198" font-size="12" text-anchor="middle" fill="#1e3a8a">Status LED · buzzer</text>
  <rect x="860" y="124" width="140" height="60" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="930" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3a8a">Logic supply</text>
  <text x="930" y="162" font-size="11" text-anchor="middle" fill="#1e3a8a">12→5 V buck, own fuse</text><text x="930" y="175" font-size="10" text-anchor="middle" fill="#1e3a8a">fed before K1: stays on</text>
  <g stroke="#1d4ed8" stroke-width="2" fill="none">
    <line x1="190" y1="141" x2="296" y2="160" marker-end="url(#b)"/>
    <line x1="190" y1="183" x2="296" y2="183" marker-end="url(#b)"/>
    <line x1="190" y1="225" x2="296" y2="206" marker-end="url(#b)"/>
    <line x1="550" y1="150" x2="616" y2="144" marker-end="url(#b)"/>
    <line x1="550" y1="193" x2="616" y2="193" marker-end="url(#b)"/>
    <path d="M860,151 L820,151 L820,230 L554,230" marker-end="url(#b)"/>
        <path d="M790,144 L835,144 L835,262 L760,262 L760,296" marker-end="url(#b)"/>
  </g>
  <text x="842" y="232" font-size="11" fill="#1d4ed8">to driver logic</text>

  <!-- POWER -->
  <g font-size="12">
    <rect x="40" y="304" width="140" height="56" rx="10" fill="#fff" stroke="#c2410c"/>
    <text x="110" y="328" font-weight="700" text-anchor="middle" fill="#7c2d12">12 V supply</text>
    <text x="110" y="346" font-size="11" text-anchor="middle" fill="#9a3412">provisional 3 A</text>
    <rect x="230" y="304" width="100" height="56" rx="10" fill="#fff" stroke="#c2410c"/>
    <text x="280" y="337" font-weight="700" text-anchor="middle" fill="#7c2d12">Fuse F1</text>
    <rect x="380" y="304" width="150" height="56" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
    <text x="455" y="328" font-weight="700" text-anchor="middle" fill="#7c2d12">K1 contact (NO)</text>
    <text x="455" y="346" font-size="11" text-anchor="middle" fill="#9a3412">open = no actuator power</text>
    <rect x="600" y="300" width="190" height="64" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/>
    <text x="695" y="326" font-weight="700" text-anchor="middle" fill="#7c2d12">Dual H-bridge</text>
    <text x="695" y="344" font-size="11" text-anchor="middle" fill="#9a3412">rating from motor stall current</text>
    <rect x="860" y="294" width="140" height="34" rx="8" fill="#fff" stroke="#c2410c"/><text x="930" y="316" text-anchor="middle" fill="#7c2d12">J1 motor (worm)</text>
    <rect x="860" y="338" width="140" height="34" rx="8" fill="#fff" stroke="#c2410c"/><text x="930" y="360" text-anchor="middle" fill="#7c2d12">J2 motor (worm)</text>
  </g>
  <g stroke="#c2410c" stroke-width="4" fill="none">
    <line x1="180" y1="332" x2="226" y2="332" marker-end="url(#o)"/>
    <line x1="330" y1="332" x2="376" y2="332" marker-end="url(#o)"/>
    <line x1="530" y1="332" x2="596" y2="332" marker-end="url(#o)"/>
    <line x1="790" y1="318" x2="856" y2="311" marker-end="url(#o)"/>
    <line x1="790" y1="346" x2="856" y2="355" marker-end="url(#o)"/>
  </g>
  
  <!-- SAFETY -->
  <g font-size="12">
    <rect x="40" y="458" width="160" height="70" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/>
    <text x="120" y="486" font-size="15" font-weight="700" text-anchor="middle" fill="#b91c1c">E-STOP</text>
    <text x="120" y="506" font-size="11" text-anchor="middle" fill="#7f1d1d">latching · NC</text>
    <rect x="260" y="458" width="130" height="70" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <text x="325" y="488" font-weight="700" text-anchor="middle" fill="#b91c1c">K1 coil</text>
    <text x="325" y="506" font-size="11" text-anchor="middle" fill="#7f1d1d">+ flyback diode</text>
    <rect x="450" y="458" width="150" height="70" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <text x="525" y="486" font-weight="700" text-anchor="middle" fill="#b91c1c">MOSFET (low side)</text>
    <text x="525" y="504" font-size="11" text-anchor="middle" fill="#7f1d1d">gate ← GPIO38</text>
    <text x="525" y="519" font-size="11" text-anchor="middle" fill="#7f1d1d">100 kΩ pull-down = off</text>
    <rect x="660" y="458" width="170" height="70" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <text x="745" y="486" font-weight="700" text-anchor="middle" fill="#b91c1c">Limit switches ×4</text>
    <text x="745" y="504" font-size="11" text-anchor="middle" fill="#7f1d1d">NC to GND · pull-ups</text>
    <text x="745" y="519" font-size="11" text-anchor="middle" fill="#7f1d1d">J1 L/R · J2 down/up</text>
    <rect x="870" y="458" width="130" height="70" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <text x="935" y="486" font-weight="700" text-anchor="middle" fill="#b91c1c">Rail sense</text>
    <text x="935" y="504" font-size="11" text-anchor="middle" fill="#7f1d1d">divider after K1</text>
    <text x="935" y="519" font-size="11" text-anchor="middle" fill="#7f1d1d">→ ADC GPIO4</text>
  </g>
  <g stroke="#dc2626" stroke-width="2.5" fill="none">
    <line x1="200" y1="493" x2="256" y2="493" marker-end="url(#r)"/>
    <line x1="390" y1="493" x2="446" y2="493" marker-end="url(#r)"/>
    <path d="M325,458 L325,410 L455,410 L455,364" stroke-dasharray="7 4" marker-end="url(#r)"/>
  </g>
  <text x="335" y="428" font-size="11" fill="#b91c1c">coil holds contact closed</text>
  <g stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M745,458 L745,420 L580,420 L580,246" marker-end="url(#r)"/>
    <path d="M935,458 L935,436 L565,436 L565,246" marker-end="url(#r)"/>
    <path d="M525,458 L525,448 L500,448 L500,246" marker-start="url(#r)"/>
  </g>
  <text x="40" y="560" font-size="12" fill="#7f1d1d">E-stop pressed → coil loop opens → K1 opens → actuator rail dead (MCU state irrelevant).</text>
  <text x="40" y="580" font-size="12" fill="#7f1d1d">Firmware can drop K1 (SAFE / FAULT / watchdog) but cannot energise it while E-stop is pressed.</text>
  <text x="40" y="600" font-size="12" fill="#7f1d1d">Boot / reset / flashing → gate pulled low → K1 off → safe startup.</text>

  <g font-size="12" fill="#334155">
    <line x1="700" y1="634" x2="736" y2="634" stroke="#1d4ed8" stroke-width="2" marker-end="url(#b)"/><text x="742" y="638">logic</text>
    <line x1="790" y1="634" x2="826" y2="634" stroke="#c2410c" stroke-width="4" marker-end="url(#o)"/><text x="832" y="638">actuator power</text>
    <line x1="924" y1="634" x2="960" y2="634" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/><text x="966" y="638">safety</text>
  </g>
</svg>
